<main class="w-full max-w-[440px] z-10 relative flex flex-col items-center">
  <!-- Brand -->
  <div class="w-11 h-11 bg-primary-container rounded-[10px] flex items-center justify-center auth-logo">
    <span class="material-symbols-outlined text-on-primary text-[22px]">dataset</span>
  </div>
  <h1 class="font-headline-md text-[20px] font-medium text-on-surface mt-3 tracking-tight">Staffing platform</h1>
  <p class="font-body-md text-[13px] text-text-muted mt-1">Resource allocation and management</p>

  <!-- Card -->
  <div class="w-full max-w-[340px] bg-surface-container-lowest border border-border-subtle rounded-xl p-6 mt-6 auth-card">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <label class="block font-label-md text-[14px] font-medium text-on-surface mb-2" for="username">Username</label>
      <div class="relative mb-4">
        <input class="w-full h-[52px] px-4 pr-11 border border-border-subtle rounded-lg font-body-md text-[15px] text-on-surface input-focus-ring transition-soft placeholder:text-outline-variant" id="username" type="text" placeholder="your.username" formControlName="username"/>
        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">person</span>
      </div>

      <!-- Password -->
      <label class="block font-label-md text-[14px] font-medium text-on-surface mb-2" for="password">Password</label>
      <div class="relative mb-5">
        <input class="w-full h-[52px] px-4 pr-11 border border-border-subtle rounded-lg font-body-md text-[15px] text-on-surface input-focus-ring transition-soft placeholder:text-outline-variant" id="password" type="password" placeholder="••••••••" formControlName="password"/>
        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">lock</span>
      </div>

      <!-- Error -->
      @if (errorMessage()) {
        <p class="text-error text-[13px] font-body-md mb-3">{{ errorMessage() }}</p>
      }

      <!-- Submit -->
      <button class="w-full h-[52px] bg-primary text-on-primary font-headline-md text-[15px] font-medium rounded-lg hover:bg-tertiary transition-all duration-200 disabled:opacity-60 btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in...' : 'Sign in' }}
      </button>

      <!-- Admin note -->
      <div class="flex gap-2 bg-surface-container-low rounded-lg px-3 py-2.5 mt-4">
        <span class="material-symbols-outlined text-primary-container text-[16px] shrink-0 mt-0.5">info</span>
        <span class="font-body-md text-[12px] text-on-surface-variant leading-relaxed">Accounts are provisioned by your administrator. Contact them for access or a password reset.</span>
      </div>
    </form>
  </div>

  <p class="font-label-sm text-[11px] text-outline-variant mt-5">© 2026 Staffing platform · internal tool</p>
</main>
