<div class="flex min-h-screen bg-bg-surface">
  <!-- Sidebar -->
  <aside class="w-[200px] bg-surface-container-lowest border-r border-border-subtle flex flex-col shrink-0">
    <div class="flex items-center gap-2 px-4 py-4">
      <div class="w-7 h-7 bg-primary-container rounded-lg flex items-center justify-center">
        <span class="material-symbols-outlined text-on-primary text-[16px]">dataset</span>
      </div>
      <span class="font-headline-md text-[14px] font-medium text-on-surface">Staffing</span>
    </div>

    <nav class="px-2 flex flex-col gap-0.5">
      <a routerLink="/dashboard" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">dashboard</span> Dashboard
      </a>
      <a routerLink="/employees" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">group</span> Employees
      </a>
      <a routerLink="/projects" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">work</span> Projects
      </a>
      <a routerLink="/allocations" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">assignment</span> Allocations
      </a>
      <a routerLink="/bench" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">chair</span> Bench
      </a>
      <a routerLink="/recommendations" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">auto_awesome</span> Recommendations
      </a>
      <a routerLink="/certifications" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">workspace_premium</span> Certifications
      </a>
      <a routerLink="/reports" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">bar_chart</span> Reports
      </a>
      <a routerLink="/users" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">manage_accounts</span> Users
      </a>
      <a routerLink="/audit-logs" routerLinkActive="bg-surface-container-low text-primary" class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-on-surface-variant font-body-md text-[13px] hover:bg-surface-container-low transition-soft">
        <span class="material-symbols-outlined text-[18px]">history</span> Audit logs
      </a>
    </nav>
  </aside>

  <!-- Main area -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Topbar -->
    <header class="h-[52px] bg-surface-container-lowest border-b border-border-subtle flex items-center justify-between px-4 shrink-0">
      <span class="font-body-md text-[13px] text-text-muted">Resource allocation and management</span>
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-outline text-[19px]">notifications</span>
        <div class="w-7 h-7 rounded-full bg-surface-container-low text-primary font-label-md text-[11px] font-medium flex items-center justify-center">AD</div>
        <button (click)="logout()" class="font-body-md text-[12px] text-text-muted hover:text-error transition-soft">Sign out</button>
      </div>
    </header>

    <!-- Page content renders here -->
    <main class="flex-1 overflow-auto min-w-0 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
